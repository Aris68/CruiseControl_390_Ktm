; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Plain "pio run" and the IDE buttons build the main firmware only.
default_envs = esp32-c6-devkitm-1

[env:esp32-c6-devkitm-1]
platform = espressif32
board = esp32-c6-devkitm-1
framework = arduino
monitor_speed = 115200

build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

; Guided test that finds the CAN code of each control. See
; test/signal_finder/signal_finder.cpp. It is its own firmware: it builds only
; the test file plus the unmodified Wi-Fi console from src.
;   pio run -e signal_finder -t upload
[env:signal_finder]
extends = env:esp32-c6-devkitm-1
build_src_filter = -<*> +<console.cpp> +<../test/signal_finder/>
